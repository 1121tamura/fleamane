version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/home/vscode/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - claude-data:/home/vscode/.claude
    ports:
      - "8080:8080"
    environment:
      - GOPATH=/home/vscode/go
      - GOCACHE=/home/vscode/.cache/go-build
      - GOPROXY=https://proxy.golang.org,direct
    command: sleep infinity
    user: vscode

volumes:
  go-mod-cache:
  go-build-cache:
  claude-data:
